version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  labels: # only this label; by default Dependabot also adds one per ecosystem (java, javascript, github_actions)
  - "dependencies"
  schedule:
    interval: daily
  commit-message:
    prefix: "GitHub Actions"
    include: "scope"
- package-ecosystem: "npm"
  directory: "/"
  labels: # only this label; by default Dependabot also adds one per ecosystem (java, javascript, github_actions)
  - "dependencies"
  schedule:
    interval: daily
  commit-message:
    prefix: "NPM"
    include: "scope"
  groups:
    eslint:
      patterns:
      - "@eslint/js"
      - "eslint"
      - "typescript-eslint"
  ignore:
  - dependency-name: "@types/vscode" # has to match engines.vscode in package.json (vscode-languageclient requires 1.91)
  - dependency-name: "@types/node" # has to match the Node.js version of the extension host (20)
    update-types: ["version-update:semver-major"]
  - dependency-name: "typescript" # not yet supported by typescript-eslint
    update-types: ["version-update:semver-major"]
